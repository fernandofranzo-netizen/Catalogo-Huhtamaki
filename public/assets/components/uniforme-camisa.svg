<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <pattern id="cad-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.8" />
    </pattern>
    <linearGradient id="shirt-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="collar-shade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="refl-tape" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background CAD Grid -->
  <rect width="400" height="300" fill="#f8fafc" />
  <rect width="400" height="300" fill="url(#cad-grid)" />

  <g transform="translate(100, 25)" filter="url(#soft-shadow)">
    <!-- Main Shirt Body & Sleeves -->
    <!-- Left Sleeve -->
    <path d="M 50 35 L 5 85 L 30 110 L 58 75 Z" fill="#0369a1" stroke="#0f172a" stroke-width="1.8" />
    <!-- Sleeve tape -->
    <path d="M 12 77 L 22 89 L 36 78 L 26 66 Z" fill="url(#refl-tape)" stroke="#94a3b8" stroke-width="0.8" />

    <!-- Right Sleeve -->
    <path d="M 150 35 L 195 85 L 170 110 L 142 75 Z" fill="#0369a1" stroke="#0f172a" stroke-width="1.8" />
    <!-- Sleeve tape -->
    <path d="M 188 77 L 178 89 L 164 78 L 174 66 Z" fill="url(#refl-tape)" stroke="#94a3b8" stroke-width="0.8" />

    <!-- Torso -->
    <path d="M 50 35 Q 100 45 150 35 L 152 225 L 48 225 Z" fill="url(#shirt-blue)" stroke="#0f172a" stroke-width="2" />

    <!-- Chest Reflective Tape -->
    <rect x="48" y="125" width="104" height="12" fill="url(#refl-tape)" stroke="#94a3b8" stroke-width="0.8" />

    <!-- Center Placket -->
    <rect x="93" y="38" width="14" height="85" fill="#075985" stroke="#0c4a6e" stroke-width="1" />
    <!-- Buttons -->
    <circle cx="100" cy="55" r="2.5" fill="#f8fafc" stroke="#64748b" stroke-width="0.8" />
    <circle cx="100" cy="78" r="2.5" fill="#f8fafc" stroke="#64748b" stroke-width="0.8" />
    <circle cx="100" cy="102" r="2.5" fill="#f8fafc" stroke="#64748b" stroke-width="0.8" />

    <!-- Left Collar -->
    <path d="M 100 40 L 72 20 L 80 50 Z" fill="url(#collar-shade)" stroke="#0f172a" stroke-width="1.5" />
    <!-- Right Collar -->
    <path d="M 100 40 L 128 20 L 120 50 Z" fill="url(#collar-shade)" stroke="#0f172a" stroke-width="1.5" />

    <!-- Chest Pocket -->
    <rect x="58" y="75" width="28" height="32" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,1" />
    <line x1="58" y1="85" x2="86" y2="85" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Technical specs legend -->
  <g transform="translate(20, 275)" font-family="monospace" font-size="9" fill="#64748b">
    <text x="0" y="0">CAMISA / CAMISETA POLO UNIFORME INDUSTRIAL WORKWEAR</text>
  </g>
</svg>

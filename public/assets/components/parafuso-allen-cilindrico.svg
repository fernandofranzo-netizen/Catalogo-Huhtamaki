<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <pattern id="cad-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.8" />
    </pattern>
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="steel-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="dark-steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="80%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="blue-ind" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background CAD Grid -->
  <rect width="400" height="300" fill="#f8fafc" />
  <rect width="400" height="300" fill="url(#cad-grid)" />
  
  <!-- Outer border -->
  <rect x="10" y="10" width="380" height="280" rx="6" fill="none" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Technical Header watermark -->
  <text x="24" y="34" font-family="monospace" font-weight="bold" font-size="11" fill="#0284c7" letter-spacing="1.5">ESPECIFICAÇÃO TÉCNICA // CAD</text>
  <text x="376" y="34" text-anchor="end" font-family="monospace" font-weight="bold" font-size="11" fill="#64748b">DIN 912 / ISO 4762</text>
  <line x1="24" y1="42" x2="376" y2="42" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 2" />

  <!-- Component Graphic -->
  <g transform="translate(0, 0)" filter="url(#shadow)">
    
      <g transform="translate(200, 138)">
        <!-- Head -->
        <rect x="-85" y="-32" width="48" height="64" rx="2" fill="url(#metal-grad)" stroke="#1e293b" stroke-width="2.5" />
        <!-- Knurling ridges on head -->
        <line x1="-75" y1="-32" x2="-75" y2="32" stroke="#475569" stroke-width="1.5" />
        <line x1="-65" y1="-32" x2="-65" y2="32" stroke="#475569" stroke-width="1.5" />
        <line x1="-55" y1="-32" x2="-55" y2="32" stroke="#475569" stroke-width="1.5" />
        <!-- Shank / Unthreaded body -->
        <rect x="-37" y="-20" width="30" height="40" fill="url(#metal-grad)" stroke="#1e293b" stroke-width="2" />
        <!-- Threaded portion -->
        <rect x="-7" y="-20" width="85" height="40" fill="#cbd5e1" stroke="#1e293b" stroke-width="2" />
        <!-- Threads -->
        
          <line x1="-7" y1="-20" x2="0" y2="20" stroke="#334155" stroke-width="2" />
          <line x1="-4" y1="-20" x2="3" y2="20" stroke="#ffffff" stroke-width="1" opacity="0.7" />
        
          <line x1="0" y1="-20" x2="7" y2="20" stroke="#334155" stroke-width="2" />
          <line x1="3" y1="-20" x2="10" y2="20" stroke="#ffffff" stroke-width="1" opacity="0.7" />
        
          <line x1="7" y1="-20" x2="14" y2="20" stroke="#334155" stroke-width="2" />
          <line x1="10" y1="-20" x2="17" y2="20" stroke="#ffffff" stroke-width="1" opacity="0.7" />
        
          <line x1="14" y1="-20" x2="21" y2="20" stroke="#334155" stroke-width="2" />
          <line x1="17" y1="-20" x2="24" y2="20" stroke="#ffffff" stroke-width="1" opacity="0.7" />
        
          <line x1="21" y1="-20" x2="28" y2="20" stroke="#334155" stroke-width="2" />
          <line x1="24" y1="-20" x2="31" y2="20" stroke="#ffffff" stroke-width="1" opacity="0.7" />
        
          <line x1="28" y1="-20" x2="35" y2="20" stroke="#334155" stroke-width="2" />
          <line x1="31" y1="-20" x2="38" y2="20" stroke="#ffffff" stroke-width="1" opacity="0.7" />
        
          <line x1="35" y1="-20" x2="42" y2="20" stroke="#334155" stroke-width="2" />
          <line x1="38" y1="-20" x2="45" y2="20" stroke="#ffffff" stroke-width="1" opacity="0.7" />
        
          <line x1="42" y1="-20" x2="49" y2="20" stroke="#334155" stroke-width="2" />
          <line x1="45" y1="-20" x2="52" y2="20" stroke="#ffffff" stroke-width="1" opacity="0.7" />
        
          <line x1="49" y1="-20" x2="56" y2="20" stroke="#334155" stroke-width="2" />
          <line x1="52" y1="-20" x2="59" y2="20" stroke="#ffffff" stroke-width="1" opacity="0.7" />
        
          <line x1="56" y1="-20" x2="63" y2="20" stroke="#334155" stroke-width="2" />
          <line x1="59" y1="-20" x2="66" y2="20" stroke="#ffffff" stroke-width="1" opacity="0.7" />
        
          <line x1="63" y1="-20" x2="70" y2="20" stroke="#334155" stroke-width="2" />
          <line x1="66" y1="-20" x2="73" y2="20" stroke="#ffffff" stroke-width="1" opacity="0.7" />
        
        <!-- Chamfered end -->
        <polygon points="78,-20 88,-14 88,14 78,20" fill="url(#metal-grad)" stroke="#1e293b" stroke-width="2" />
        <!-- Hex socket view inset on left -->
        <g transform="translate(-130, 0)">
          <circle cx="0" cy="0" r="24" fill="url(#metal-grad)" stroke="#1e293b" stroke-width="2" />
          <!-- Hexagon -->
          <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" />
        </g>
      </g>
    
  </g>

  <!-- Title footer badge -->
  <rect x="24" y="246" width="352" height="30" rx="4" fill="#0f172a" />
  <text x="36" y="266" font-family="sans-serif" font-weight="bold" font-size="11" fill="#f8fafc" letter-spacing="0.8">PARAFUSO ALLEN CABEÇA CILÍNDRICA</text>
  <text x="364" y="266" text-anchor="end" font-family="monospace" font-weight="bold" font-size="10" fill="#38bdf8">REF. INDUSTRIAL</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="fabricGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="hiVisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="reflGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Technical Grid Background -->
  <rect width="400" height="400" fill="url(#bgGrad)" rx="8" />
  <g stroke="#334155" stroke-width="0.75" opacity="0.4">
    <line x1="40" y1="0" x2="40" y2="400" />
    <line x1="80" y1="0" x2="80" y2="400" />
    <line x1="120" y1="0" x2="120" y2="400" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" stroke="#38bdf8" stroke-dasharray="4,4" opacity="0.6" />
    <line x1="240" y1="0" x2="240" y2="400" />
    <line x1="280" y1="0" x2="280" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="360" y1="0" x2="360" y2="400" />
    <line x1="0" y1="40" x2="400" y2="400" />
    <line x1="0" y1="80" x2="400" y2="80" />
    <line x1="0" y1="120" x2="400" y2="120" />
    <line x1="0" y1="160" x2="400" y2="160" />
    <line x1="0" y1="200" x2="400" y2="200" stroke="#38bdf8" stroke-dasharray="4,4" opacity="0.6" />
    <line x1="0" y1="240" x2="400" y2="240" />
    <line x1="0" y1="280" x2="400" y2="280" />
    <line x1="0" y1="320" x2="400" y2="320" />
    <line x1="0" y1="360" x2="400" y2="360" />
  </g>

  <!-- Technical Uniform Illustration -->
  <g transform="translate(10, 10)">
    <!-- Operational Jacket / Shirt Shape -->
    <path d="M 140 70 L 170 85 L 210 85 L 240 70 L 295 105 L 265 160 L 235 145 L 235 285 L 145 285 L 145 145 L 115 160 L 85 105 Z"
          fill="url(#fabricGrad)" stroke="#60a5fa" stroke-width="2" stroke-linejoin="round" />

    <!-- Reflective High-Vis Band Across Chest -->
    <path d="M 145 165 L 235 165 L 235 195 L 145 195 Z" fill="url(#hiVisGrad)" stroke="#facc15" stroke-width="1.5" />
    <path d="M 145 175 L 235 175 L 235 185 L 145 185 Z" fill="url(#reflGrad)" />

    <!-- Reflective Arm Bands -->
    <polygon points="98,126 128,144 122,154 92,136" fill="url(#hiVisGrad)" />
    <polygon points="252,144 282,126 288,136 258,154" fill="url(#hiVisGrad)" />

    <!-- Collar and Button Placket -->
    <path d="M 170 85 L 190 120 L 190 285" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6,4" />
    <polygon points="170,85 190,115 175,115" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5" />
    <polygon points="210,85 190,115 205,115" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5" />

    <!-- Chest Pocket -->
    <rect x="155" y="125" width="28" height="32" rx="3" fill="#1e40af" stroke="#60a5fa" stroke-width="1.5" />
    <line x1="155" y1="135" x2="183" y2="135" stroke="#93c5fd" stroke-width="1.5" />

    <!-- Manutamaki Identification Patch Placeholder -->
    <rect x="198" y="132" width="26" height="14" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="202" y="142" fill="#38bdf8" font-family="monospace" font-size="7" font-weight="bold">EPI</text>

    <!-- Buttons -->
    <circle cx="190" cy="140" r="3" fill="#cbd5e1" stroke="#475569" stroke-width="1" />
    <circle cx="190" cy="215" r="3" fill="#cbd5e1" stroke="#475569" stroke-width="1" />
    <circle cx="190" cy="250" r="3" fill="#cbd5e1" stroke="#475569" stroke-width="1" />

    <!-- Technical Annotations -->
    <text x="30" y="360" fill="#94a3b8" font-family="monospace" font-size="11" letter-spacing="1">UNIFORME OPERACIONAL PROFISSIONAL</text>
    <text x="30" y="375" fill="#38bdf8" font-family="monospace" font-size="10">BRIM / POLIVISCOSE / ALTA VISIBILIDADE / FR</text>
  </g>
</svg>
